# $schema: https://json.schemastore.org/github-workflow.json
---
# Builds the static site and publishes it to GitHub Pages. The docs pages come
# from the patchcaster repository at build time (scripts/sync-docs.mjs), so a
# daily build picks up docs changes there without a cross-repository trigger.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer build does not cancel one in flight.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read # configure-pages reads the site's URL and base path
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The docs' single source, a public repository. Cone mode keeps the
      # top-level README and CHANGELOG next to docs/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: patchcaster-app/patchcaster
          path: patchcaster
          sparse-checkout: docs
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Reports where Pages serves the site: a /<repository> prefix for a
      # project site, none for a custom domain.
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build
        run: npm run build
        env:
          PATCHCASTER_DIR: patchcaster
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the artifact
      id-token: write # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
